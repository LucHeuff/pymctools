[project]
name = "pymctools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "altair>=6.2.2",
  "arviz-base>=1.2.0",
  "arviz-stats[xarray]>=1.2.0",
  "netcdf4>=1.7.4",
  "polars>=1.34.0",
  "pyarrow>=21.0.0",
  "vl-convert-python>=1.9.0.post1",
  "xarray>=2025.10.1",
]

[dependency-groups]
dev = [
  "hypothesis[numpy]>=6.140.3",
  "pooch>=1.9.0",
  "pytest>=8.4.2",
  "pytest-cov>=7.1.0",
  "pytest-coverage>=0.0",
]

[tool.coverage.run]
omit = ["*/.local/*", "*/src/netCDF4/*"]
